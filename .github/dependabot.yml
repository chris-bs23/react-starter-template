# Automated dependency and GitHub Actions updates.
# Enterprise supply-chain hygiene: keep the pinned stack current and patch
# vulnerabilities quickly without manual bump PRs. See docs/SECURITY.md.
version: 2
updates:
  # Application dependencies (pnpm / npm registry).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Batch low-risk updates to reduce PR noise; majors stay individual.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Framework majors are deliberate, reviewed decisions (see docs/DECISIONS.md).
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used by workflows in .github/workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    commit-message:
      prefix: "chore(ci)"
